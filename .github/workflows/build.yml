name: CI

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-11-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
        pip install --upgrade pip
        pip install cython==0.29.36 buildozer

    - name: Build with Buildozer
      run: |
        buildozer init
        sed -i 's/# title = my App/title = Plataforma de Crescimento/' buildozer.spec
        sed -i 's/# package.name = myapp/package.name = plataformadecrescimento/' buildozer.spec
        sed -i 's/# source.include_exts = png,jpg,kv,atlas/source.include_exts = py,png,jpg,kv,atlas/' buildozer.spec
        sed -i 's/# requirements = python3,kivy/requirements = python3,kivy,pillow/' buildozer.spec
        sed -i 's/android.ndk =.*/android.ndk = 25b/' buildozer.spec
        sed -i 's/# android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
        sed -i 's/android.accept_sdk_license =.*/android.accept_sdk_license = True/' buildozer.spec
        export BUILDOZER_ALLOW_root=1
        buildozer -v android debug
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
